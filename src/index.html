<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <h1>📋 My To Do List</h1>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Mau ngapain hari ini?"
        autocomplete="off"
      />
      <button type="submit">Tambah</button>
    </form>

    <!--
      TODO (Fitur #3 - Filter Task):
      Tambahkan 3 tombol filter di sini: "Semua", "Aktif", "Selesai".
      Lihat README.md bagian "Fitur yang Harus Dibuat" nomor 3 untuk hint lengkap.
    -->
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="active">Aktif</button>
        <button class="filter-btn" data-filter="completed">Selesai</button> 
      </div>


    <ul id="task-list" class="task-list">
      <!-- Task dirender otomatis oleh js/app.js, jangan ditulis manual di sini -->
    </ul>

    

    <div class="footer" id="footer">
        <span id="task-counter">0 task tersisa</span>
        <button id="clear-completed">Hapus yang Selesai</button>
      </div>
    
  </main>

  <script src="js/app.js"></script>
</body>
</html>
