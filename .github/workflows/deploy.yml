name: Deploy produksi

# Manual dispatch supaya tidak ada build merah saat secrets belum diisi.
# Setelah secrets terpasang, bisa ganti `on: push: branches: [main]`.
on:
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version dibaca otomatis dari package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + test)
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Build (OpenNext)
        run: pnpm exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_API_MODE: http

      - name: Deploy ke Cloudflare
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
